name: Chapter 3 acceptance obligations
on: [push, pull_request]
permissions:
  contents: read
jobs:
  acceptance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Chapter 2 canned scenario smoke check
        run: python app.py
      - name: Chapter 3 acceptance suite (intentionally red)
        run: python -m unittest discover -s tests -v
