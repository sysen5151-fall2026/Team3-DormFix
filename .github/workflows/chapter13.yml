name: DormFix Chapter 13 integration
on:
  push:
    branches: [task7/implementation-integration]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  clean-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.12'
      - name: Verify Python and SQLite
        run: python -c "import sys, sqlite3; print(sys.version, sqlite3.sqlite_version)"
      - name: Run service and recovery regression tests
        run: python -m unittest discover -s tests -v
      - name: Exercise all interfaces and fault containment
        run: python verify_ch13.py
      - name: Start pinned CPU inference server and require a real model result
        shell: bash
        run: |
          set -euo pipefail
          python -u scripts/start_model.py > "$RUNNER_TEMP/dormfix-model.log" 2>&1 &
          model_pid=$!
          trap 'kill "$model_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 150); do
            if curl -fsS --max-time 2 http://127.0.0.1:8081/health >/dev/null 2>&1; then break; fi
            if ! kill -0 "$model_pid" 2>/dev/null; then cat "$RUNNER_TEMP/dormfix-model.log"; exit 1; fi
            sleep 2
          done
          curl -fsS http://127.0.0.1:8081/health
          python verify_ch13.py --live

